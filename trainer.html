<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Trainer Docs</title>

    <link rel="icon" type="image/x-icon" href="./img/Logo.png">

    <link rel="stylesheet" href="./js/vendor/select2/select2.css">
    <link rel="stylesheet" href="./css/trainer.css?select2-search-style-20261024">
    <link rel="stylesheet" href="./css/trainer-dark-theme.css?trainer-dark-mode-20261024" id="dark-theme-styles">
    <script>
        var trainerDarkMode = localStorage.getItem('darkTheme') === 'true';
        document.getElementById('dark-theme-styles').disabled = !trainerDarkMode;
    </script>

</head>

<body>

    <main class="trainer-page">

        <header class="trainer-header">

            <a class="back-link" href="./index.html">Damage Calculator</a>

            <div class="header-copy">

                <p class="eyebrow">Nuzlocke Resources</p>

                <h1>Trainer Docs</h1>


            </div>
            <div class="theme-control">
                <div class="dark-light-toggle">
                    <input type="checkbox" id="trainer-theme-toggle" aria-label="Dark mode">
                    <label for="trainer-theme-toggle" class="dark-theme-toggle" aria-label="Toggle dark mode"></label>
                </div>
            </div>

        </header>



        <section class="controls" aria-label="Trainer chart controls">

            <div class="game-picker-field">

                <span>Game</span>

                <div id="game-picker" class="game-picker" role="radiogroup" aria-label="Select a game"></div>

            </div>
            <div class="trainer-control">
                <label id="trainer-label" for="trainer-select">Trainer</label>
                <select id="trainer-select"></select>
            </div>

        </section>



        <section class="fight-heading" aria-live="polite">

            <div>

                <p class="eyebrow" id="fight-game">Select a game</p>

                <h2 id="fight-name">Choose a trainer</h2>

            </div>

            <div class="heading-actions">

                <div class="team-summary" id="team-summary">0 Pokemon</div>
                <button class="route-navigation-button" id="previous-route" type="button">Previous Route</button>
                <button class="route-navigation-button" id="next-route" type="button">Next Route</button>

            </div>

        </section>



        <section class="team-chart" id="team-chart" aria-live="polite"></section>

    </main>



    <script src="./js/data/sets/games/Gen1/RedBlue.js"></script>
